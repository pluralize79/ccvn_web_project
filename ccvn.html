
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>CCVN - Visual Novel</title>
    <link rel="stylesheet" href="./css/ccvn.css">
</head>
<body>
    <main class="vn-page">
        <header class="vn-header">
            <div class="vn-header-left">
                <button
                    type="button"
                    class="top-button close-button"
                    id="closeButton"
                    aria-label="편집기로 돌아가기"
                    title="편집기로 돌아가기"
                >×</button>

                <button
                    type="button"
                    class="top-button"
                    id="autoButton"
                    aria-pressed="false"
                >Auto</button>

                <button
                    type="button"
                    class="top-button"
                    id="backButton"
                >back</button>
            </div>

            <div class="scene-counter" id="sceneCounter">0 / 0</div>
        </header>

        <section class="vn-stage" id="vnStage">
            <div class="vn-character" id="vnCharacter" aria-hidden="true">
                <div class="vn-character-shell message" id="vnCharacterShell">
                    <span class="avatar" id="vnAvatar"></span>
                </div>
            </div>

            <div class="vn-empty" id="emptyMessage">
                <strong>불러오는 중...</strong>
                <p>편집기에서 만든 대사를 불러오고 있습니다.</p>
            </div>

            <section
                class="vn-dialogue-area"
                id="vnDialogueArea"
                aria-label="대화"
                hidden
            >
                <div class="vn-speaker" id="vnSpeaker"></div>

                <button
                    type="button"
                    class="vn-dialogue"
                    id="vnDialogue"
                    aria-label="다음 대사"
                >
                    <span class="vn-message" id="vnMessage"></span>
                    <span class="next-arrow" aria-hidden="true"></span>
                </button>
            </section>
        </section>

        <div class="vn-status" id="vnStatus" role="status" aria-live="polite"></div>
    </main>
    <script src="./js/ccvn.js" defer></script>
</body>
</html>
